<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRC 代币合约控制器 v2.2.0</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <style>
    body { background: #f4f6f9; font-family: 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif; }
    .panel-card { background: #fff; border-radius: 16px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); padding: 1.5rem; margin-bottom: 1.8rem; }
    .section-title { border-left: 4px solid #0d6efd; padding-left: 12px; margin-bottom: 1.2rem; font-weight: 600; }
    .info-row { display: flex; justify-content: space-between; padding: 0.45rem 0; border-bottom: 1px dashed #dee2e6; }
    .info-label { font-weight: 500; color: #495057; }
    .info-value { color: #0d6efd; font-weight: 600; word-break: break-all; }
    .param-group { background: #f8f9fa; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .param-title { font-weight: 600; }
    .param-desc { font-size: 0.8rem; color: #6c757d; margin: 4px 0; }
    .param-example { font-size: 0.75rem; color: #198754; }
    .btn-action { font-size: 0.85rem; }
  </style>
</head>
<body class="container-fluid py-3">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-11">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="bi bi-gear"></i> CRC 代币合约控制器 <span class="badge bg-primary">v2.2.0</span></h2>
        <div>
          <button id="connectWalletBtn" class="btn btn-outline-primary btn-sm"><i class="bi bi-wallet2"></i> 连接钱包</button>
          <span id="walletAddressDisplay" class="ms-2 small text-muted"></span>
        </div>
      </div>

      <div class="panel-card">
        <div class="row">
          <div class="col-md-8">
            <label class="form-label fw-semibold">合约地址（自动保存）</label>
            <input type="text" id="contractAddressInput" class="form-control" placeholder="0x...">
          </div>
          <div class="col-md-4 d-flex align-items-end">
            <button id="loadContractBtn" class="btn btn-primary w-100"><i class="bi bi-arrow-repeat"></i> 加载合约</button>
          </div>
        </div>
        <small class="text-secondary">地址自动保存至浏览器，下次无需重新输入。</small>
      </div>

      <ul class="nav nav-pills mb-3 flex-wrap" id="mainTab">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-info">概览</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-tax">费率</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-invite">邀请</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-mining">挖矿</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-switches">开关</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-presale">预售</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-whitelist">名单</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-query">查询</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-tools">工具箱</button></li>
      </ul>

      <div class="tab-content">
        <!-- 概览 -->
        <div class="tab-pane fade show active" id="tab-info">
          <div class="panel-card"><h5 class="section-title">代币信息</h5><div id="tokenBasicInfo">请先加载合约</div></div>
          <div class="panel-card"><h5 class="section-title">流动性</h5><div id="pairInfoContainer">请先加载合约</div>
            <button id="launchBtn" class="btn btn-success btn-sm mt-2"><i class="bi bi-rocket"></i> 启动交易</button>
          </div>
          <div class="panel-card"><h5 class="section-title">全局参数</h5><div id="miscGlobalInfo">请先加载合约</div></div>
        </div>

        <!-- 费率 -->
        <div class="tab-pane fade" id="tab-tax">
          <div class="panel-card"><h5 class="section-title">买卖及流动性税率</h5>
            <div id="taxRatesContainer">请先加载合约</div>
            <div class="mt-2">
              <button id="updateTaxBtn" class="btn btn-warning btn-sm">批量更新买卖费率</button>
              <button id="disableChangeTaxBtn" class="btn btn-outline-danger btn-sm ms-1">锁定费率修改</button>
            </div>
          </div>
          <div class="panel-card"><h5 class="section-title">流动性税与底池燃烧</h5>
            <div id="liquidityTaxContainer">请先加载合约</div>
            <div class="mt-2">
              <button id="setAddLiqFeeBtn" class="btn btn-outline-primary btn-sm">设置添加税</button>
              <button id="setRemoveLiqFeeBtn" class="btn btn-outline-primary btn-sm">设置移除税</button>
              <button id="toggleAddLiqBtn" class="btn btn-outline-info btn-sm">切换允许添加流动性</button>
              <button id="setLpBurnRateBtn" class="btn btn-outline-primary btn-sm">设置燃烧率</button>
              <button id="setLpBurnFreqBtn" class="btn btn-outline-primary btn-sm">设置燃烧频率</button>
            </div>
          </div>
        </div>

        <!-- 邀请 -->
        <div class="tab-pane fade" id="tab-invite">
          <div class="panel-card"><h5 class="section-title">邀请参数</h5>
            <div id="inviteParamsContainer">请先加载合约</div>
            <button id="updateInviteRatesBtn" class="btn btn-warning btn-sm mt-2">更新代数与比例</button>
            <button id="setMinInvitorHoldBtn2" class="btn btn-outline-primary btn-sm ms-1">设置最小邀请人持仓</button>
            <button id="setMinTransBtn2" class="btn btn-outline-primary btn-sm ms-1">设置最小转账额</button>
          </div>
          <div class="panel-card"><h5 class="section-title">关系查询</h5>
            <input type="text" id="inviteQueryAddress" class="form-control form-control-sm mb-2" placeholder="查询地址">
            <button id="queryInviteBtn" class="btn btn-outline-secondary btn-sm">查询邀请人</button>
            <div id="inviteQueryResult" class="small mt-1"></div>
            <input type="text" id="binderOwnerInput" class="form-control form-control-sm mt-3" placeholder="邀请人地址">
            <button id="queryBindersBtn" class="btn btn-outline-secondary btn-sm mt-1">显示绑定者</button>
            <div id="bindersList" class="small mt-1"></div>
          </div>
        </div>

        <!-- 挖矿 -->
        <div class="tab-pane fade" id="tab-mining">
          <div class="panel-card"><h5 class="section-title">挖矿参数</h5>
            <div id="miningParamsContainer">请先加载合约</div>
            <button id="setLpRewardConditionBtn" class="btn btn-outline-primary btn-sm mt-2">设置奖励条件</button>
            <button id="setMinLPHoldBtn" class="btn btn-outline-primary btn-sm ms-1">设置最小LP持仓</button>
            <button id="setMinInvitorHoldBtn" class="btn btn-outline-primary btn-sm ms-1">设置最小邀请持仓</button>
            <button id="setExcludeLpBtn" class="btn btn-outline-primary btn-sm ms-1">排除/恢复LP</button>
          </div>
          <div class="panel-card"><h5 class="section-title">LP提供者</h5><div id="lpProvidersContainer">请先加载合约</div></div>
        </div>

        <!-- 开关 -->
        <div class="tab-pane fade" id="tab-switches">
          <div class="panel-card"><h5 class="section-title">开关状态</h5><div id="switchesContainer">请先加载合约</div>
            <div class="mt-2">
              <button id="toggleAntiSyncBtn" class="btn btn-outline-secondary btn-sm">防同步</button>
              <button id="toggleAirdropBtn" class="btn btn-outline-secondary btn-sm ms-1">空投</button>
              <button id="togglePauseBtn" class="btn btn-outline-secondary btn-sm ms-1">暂停转账</button>
              <button id="toggleEnablePauseBtn" class="btn btn-outline-secondary btn-sm ms-1">暂停总开关</button>
              <button id="toggleEnableMintBtn" class="btn btn-outline-secondary btn-sm ms-1">增发开关</button>
              <button id="toggleWalletLimitBtn" class="btn btn-outline-secondary btn-sm ms-1">持仓限制</button>
              <button id="disableMintBtn" class="btn btn-outline-danger btn-sm ms-1">永久禁用增发</button>
              <button id="disableWalletLimitBtn" class="btn btn-outline-danger btn-sm ms-1">永久禁用持仓限制</button>
            </div>
          </div>
          <div class="panel-card"><h5 class="section-title">限制数值</h5>
            <div id="limitsContainer">请先加载合约</div>
            <button id="setKbBtn" class="btn btn-outline-primary btn-sm mt-2">设置KB</button>
            <button id="setMaxWalletBtn" class="btn btn-outline-primary btn-sm ms-1">设置最大持仓</button>
          </div>
        </div>

        <!-- 预售 -->
        <div class="tab-pane fade" id="tab-presale">
          <div class="panel-card"><h5 class="section-title">预售</h5><div id="presaleContainer">请先加载合约</div>
            <button id="togglePresaleBtn" class="btn btn-outline-success btn-sm mt-2">切换预售</button>
            <button id="setPriceBtn" class="btn btn-outline-primary btn-sm ms-1">设置单价</button>
            <button id="setAmountPerUnitsBtn" class="btn btn-outline-primary btn-sm ms-1">设置每单位代币</button>
            <button id="setMintLimitBtn" class="btn btn-outline-primary btn-sm ms-1">设置铸造上限</button>
          </div>
        </div>

        <!-- 名单 -->
        <div class="tab-pane fade" id="tab-whitelist">
          <div class="panel-card"><h5 class="section-title">白名单/黑名单</h5>
            <input type="text" id="whitelistAddressInput" class="form-control form-control-sm mb-2" placeholder="地址">
            <button id="addFeeWhiteBtn" class="btn btn-outline-success btn-sm">加入白名单</button>
            <button id="removeFeeWhiteBtn" class="btn btn-outline-danger btn-sm ms-1">移除白名单</button>
            <input type="text" id="batchAddressInput" class="form-control form-control-sm mt-3" placeholder="批量地址,逗号分隔">
            <button id="batchRewardListBtn" class="btn btn-outline-dark btn-sm mt-1">批量加入黑名单</button>
            <input type="text" id="swapPairInput" class="form-control form-control-sm mt-3" placeholder="交易对地址">
            <button id="addSwapPairBtn" class="btn btn-outline-secondary btn-sm mt-1">启用交易对</button>
            <button id="removeSwapPairBtn" class="btn btn-outline-secondary btn-sm mt-1 ms-1">禁用交易对</button>
          </div>
        </div>

        <!-- 查询 -->
        <div class="tab-pane fade" id="tab-query">
          <div class="panel-card"><h5 class="section-title">综合查询</h5>
            <input type="text" id="queryAddressInput" class="form-control form-control-sm mb-2" placeholder="地址">
            <button id="queryAllBtn" class="btn btn-primary btn-sm">查询</button>
            <div id="queryAllResult" class="small mt-2"></div>
          </div>
        </div>

        <!-- 工具箱 -->
        <div class="tab-pane fade" id="tab-tools">
          <div class="panel-card"><h5 class="section-title">Owner工具</h5>
            <div class="row g-2">
              <div class="col-md-6"><label>新基金地址</label><input type="text" id="newFundAddress" class="form-control form-control-sm"></div>
              <div class="col-md-6 d-flex align-items-end"><button id="setFundAddressBtn" class="btn btn-outline-dark btn-sm w-100">设置基金地址</button></div>
              <div class="col-md-4"><label>代币地址</label><input type="text" id="claimTokenAddress" class="form-control form-control-sm"></div>
              <div class="col-md-4"><label>数量</label><input type="number" id="claimTokenAmount" class="form-control form-control-sm"></div>
              <div class="col-md-4"><label>接收地址</label><input type="text" id="claimTokenTo" class="form-control form-control-sm"></div>
              <div class="col-12"><button id="claimTokenBtn" class="btn btn-outline-dark btn-sm mt-1">提取代币</button></div>
              <div class="col-md-4"><label>TokenDistributor</label><input type="text" id="claimContractDistributor" class="form-control form-control-sm"></div>
              <div class="col-md-4"><label>代币地址</label><input type="text" id="claimContractTokenAddr" class="form-control form-control-sm"></div>
              <div class="col-md-4"><label>数量</label><input type="number" id="claimContractAmount" class="form-control form-control-sm"></div>
              <div class="col-12"><button id="claimContractTokenBtn" class="btn btn-outline-dark btn-sm mt-1">提取其他合约代币</button></div>
              <div class="col-md-6"><label>增发地址</label><input type="text" id="mintTo" class="form-control form-control-sm"></div>
              <div class="col-md-6"><label>增发数量</label><input type="number" id="mintAmount" class="form-control form-control-sm"></div>
              <div class="col-12"><button id="mintTokenBtn" class="btn btn-outline-dark btn-sm mt-1">增发代币</button></div>
              <div class="col-md-6"><button id="claimBalanceBtn" class="btn btn-outline-dark btn-sm w-100 mt-2">提取合约ETH</button></div>
              <div class="col-md-6"><button id="renounceOwnershipBtn" class="btn btn-outline-danger btn-sm w-100 mt-2">放弃所有权</button></div>
              <div class="col-md-8"><label>转移所有权新地址</label><input type="text" id="transferOwnershipInput" class="form-control form-control-sm"></div>
              <div class="col-md-4 d-flex align-items-end"><button id="transferOwnershipBtn" class="btn btn-outline-danger btn-sm w-100">转移所有权</button></div>
            </div>
          </div>
        </div>
      </div>

      <div class="panel-card mt-3"><h6 class="section-title">操作日志</h6><div id="logContainer" class="small" style="max-height:150px;overflow-y:auto;"></div></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function() {
      const VERSION = '2.2.0';
      let signer, provider, contract;
      let contractAddress = localStorage.getItem('crc_contract_address') || '';
      let decimals = 18, isOwner = false, currentAccount = '';

      const logContainer = document.getElementById('logContainer');
      function log(msg, type='info') {
        const p = document.createElement('div');
        p.className = `text-${type==='error'?'danger':type==='success'?'success':'dark'}`;
        p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        logContainer.prepend(p);
        if(logContainer.children.length>30) logContainer.removeChild(logContainer.lastChild);
      }

      // 完整 ABI（无省略）
      const abi = [
        "function name() view returns (string)",
        "function symbol() view returns (string)",
        "function decimals() view returns (uint256)",
        "function totalSupply() view returns (uint256)",
        "function balanceOf(address) view returns (uint256)",
        "function owner() view returns (address)",
        "function fundAddress() view returns (address)",
        "function kb() view returns (uint256)",
        "function mineRate() view returns (uint256)",
        "function antiSYNC() view returns (bool)",
        "function _swapRouter() view returns (address)",
        "function currency() view returns (address)",
        "function currencyIsEth() view returns (bool)",
        "function _mainPair() view returns (address)",
        "function _tokenDistributor() view returns (address)",
        "function _LPRewardDistributor() view returns (address)",
        "function _buyFundFee() view returns (uint256)",
        "function _buyLPFee() view returns (uint256)",
        "function buy_burnFee() view returns (uint256)",
        "function _sellFundFee() view returns (uint256)",
        "function _sellLPFee() view returns (uint256)",
        "function sell_burnFee() view returns (uint256)",
        "function removeLiquidityFee() view returns (uint256)",
        "function addLiquidityFee() view returns (uint256)",
        "function enableAddLiquidity() view returns (bool)",
        "function fristRate() view returns (uint256)",
        "function secondRate() view returns (uint256)",
        "function thirdRate() view returns (uint256)",
        "function leftRate() view returns (uint256)",
        "function generations() view returns (uint256)",
        "function _minTransAmount() view returns (uint256)",
        "function airdropNumbs() view returns (uint256)",
        "function startTradeBlock() view returns (uint256)",
        "function enableOffTrade() view returns (bool)",
        "function enableKillBlock() view returns (bool)",
        "function enableRewardList() view returns (bool)",
        "function enableChangeTax() view returns (bool)",
        "function airdropEnable() view returns (bool)",
        "function enablePause() view returns (bool)",
        "function pause() view returns (bool)",
        "function enableMint() view returns (bool)",
        "function enableWalletLimit() view returns (bool)",
        "function maxWalletAmount() view returns (uint256)",
        "function lpBurnRate() view returns (uint256)",
        "function lpBurnFrequency() view returns (uint256)",
        "function lastLpBurnTime() view returns (uint256)",
        "function presaleEnabled() view returns (bool)",
        "function price() view returns (uint256)",
        "function amountPerUnits() view returns (uint256)",
        "function mintLimit() view returns (uint256)",
        "function minted() view returns (uint256)",
        "function LPRewardCondition() view returns (uint256)",
        "function minLPHoldAmount() view returns (uint256)",
        "function minInvitorHoldAmount() view returns (uint256)",
        "function _lastMaybeAddLPAddress() view returns (address)",
        "function _lastMaybeAddLPAmount() view returns (uint256)",
        "function _swapPairList(address) view returns (bool)",
        "function _feeWhiteList(address) view returns (bool)",
        "function _rewardList(address) view returns (bool)",
        "function _inviter(address) view returns (address)",
        "function getBinderLength(address) view returns (uint256)",
        "function _binders(address,uint256) view returns (address)",
        "function _maybeInvitor(address,address) view returns (bool)",
        "function lpProviderIndex(address) view returns (uint256)",
        "function excludeLpProvider(address) view returns (bool)",
        "function getLPProviderLength() view returns (uint256)",
        "function lpProviders(uint256) view returns (address)",
        "function _lastMineLPRewardTimes(address) view returns (uint256)",
        "function _currentMineLPIndex() view returns (uint256)",
        "function _progressMineLPBlock() view returns (uint256)",
        "function _progressMineLPBlockDebt() view returns (uint256)",
        "function _mineLPRewardTimeDebt() view returns (uint256)",
        "function isReward(address) view returns (uint256)",
        "function setAntiSYNCEnable(bool)",
        "function setkb(uint256)",
        "function setAirDropEnable(bool)",
        "function launch()",
        "function setFundAddress(address)",
        "function setFeeWhiteList(address[],bool)",
        "function completeCustoms(uint256[])",
        "function changeInviteRate(uint256[])",
        "function multi_bclist(address[],bool)",
        "function setMinTransAmount(uint256)",
        "function disableChangeTax()",
        "function setSwapPairList(address,bool)",
        "function claimBalance()",
        "function claimToken(address,uint256,address)",
        "function claimContractToken(address,address,uint256)",
        "function setAddLiquidityFee(uint256)",
        "function setRemoveLiquidityFee(uint256)",
        "function setEnableAddLiquidity(bool)",
        "function setExcludeLPProvider(address,bool)",
        "function setLPRewardCondition(uint256)",
        "function setMinLPHoldAmount(uint256)",
        "function setMinInvitorHoldAmount(uint256)",
        "function setPause(bool)",
        "function setEnablePause(bool)",
        "function mintToken(address,uint256)",
        "function setEnableMint(bool)",
        "function disableMint()",
        "function setMaxWalletAmount(uint256)",
        "function setEnableWalletLimit(bool)",
        "function disableWalletLimit()",
        "function setlpBurnRate(uint256)",
        "function setlpBurnFrequency(uint256)",
        "function setPresaleEnabled(bool)",
        "function setMintLimit(uint256)",
        "function setPrice(uint256)",
        "function setAmountPerUnits(uint256)",
        "function transferOwnership(address)",
        "function renounceOwnership()"
      ];

      // 连接钱包
      document.getElementById('connectWalletBtn').onclick = async () => {
        if(!window.ethereum) return alert('请安装MetaMask');
        try {
          const accounts = await window.ethereum.request({method:'eth_requestAccounts'});
          currentAccount = accounts[0];
          provider = new ethers.providers.Web3Provider(window.ethereum);
          signer = provider.getSigner();
          document.getElementById('walletAddressDisplay').textContent = `${currentAccount.slice(0,6)}...${currentAccount.slice(-4)}`;
          const btn = document.getElementById('connectWalletBtn');
          btn.innerHTML = '<i class="bi bi-wallet2"></i> 已连接';
          btn.classList.replace('btn-outline-primary','btn-success');
          if(contractAddress) loadContract();
        } catch(e) { log('连接失败', 'error'); }
      };

      const addrInput = document.getElementById('contractAddressInput');
      addrInput.value = contractAddress;
      addrInput.addEventListener('input', ()=>{
        contractAddress = addrInput.value.trim();
        localStorage.setItem('crc_contract_address', contractAddress);
      });

      document.getElementById('loadContractBtn').onclick = loadContract;
      async function loadContract(){
        const addr = addrInput.value.trim();
        if(!ethers.utils.isAddress(addr)) return alert('无效地址');
        if(!signer) return alert('请先连接钱包');
        try {
          contract = new ethers.Contract(addr, abi, signer);
          contractAddress = addr;
          localStorage.setItem('crc_contract_address', addr);
          decimals = await contract.decimals();
          const ownerAddr = await contract.owner();
          isOwner = (ownerAddr.toLowerCase() === currentAccount.toLowerCase());
          log(`加载成功，Owner: ${isOwner?'您':'其他'}`, 'success');
          await refreshAll();
        } catch(e) { log('加载失败，请检查地址', 'error'); }
      }

      function toUnits(v, d=decimals) { return ethers.utils.parseUnits(String(v), d); }
      function fromUnits(v, d=decimals) { return ethers.utils.formatUnits(v, d); }
      function toBP(p) { return Math.floor(parseFloat(p)*100); }
      function fromBP(bp) { return (bp/100).toFixed(2); }

      async function refreshAll() {
        if(!contract) return;
        await loadBasicInfo();
        await loadPairInfo();
        await loadMisc();
        await loadTax();
        await loadInvite();
        await loadMining();
        await loadSwitches();
        await loadPresale();
      }

      async function loadBasicInfo() {
        const [name,sym,total,ownerAddr,fund,kb,mineRate,start,mainPair,tDist,lpDist,router,cur,isEth] = await Promise.all([
          contract.name(),contract.symbol(),contract.totalSupply(),contract.owner(),contract.fundAddress(),
          contract.kb(),contract.mineRate(),contract.startTradeBlock(),contract._mainPair(),
          contract._tokenDistributor(),contract._LPRewardDistributor(),contract._swapRouter(),
          contract.currency(),contract.currencyIsEth()
        ]);
        document.getElementById('tokenBasicInfo').innerHTML = `

      async function loadPairInfo() {

        const res = await pc.getReserves();
        const bal = await contract.balanceOf(mp);
        document.getElementById('pairInfoContainer').innerHTML = `
          <div class="info-row"><span class="info-label">底池代币量</span><span class="info-value">${fromUnits(bal)}</span></div>
          <div class="info-row"><span class="info-label">储备0/1</span><span class="info-value">${ethers.utils.formatEther(res[0])} / ${ethers.utils.formatEther(res[1])}</span></div>
        `;
      }

      async function loadMisc() {
        const [addr, amt, rate, freq, last] = await Promise.all([
          contract._lastMaybeAddLPAddress(), contract._lastMaybeAddLPAmount(),
          contract.lpBurnRate(), contract.lpBurnFrequency(), contract.lastLpBurnTime()
        ]);

          <div class="info-row"><span class="info-label">最后添加LP地址</span><span class="info-value">${addr}</span></div>
          <div class="info-row"><span class="info-label">最后添加LP量</span><span class="info-value">${fromUnits(amt)}</span></div>

      async function loadTax() {
        const [bf,bl,bb,sf,sl,sb,rl,al,ena,rate,freq] = await Promise.all([
          contract._buyFundFee(),contract._buyLPFee(),contract.buy_burnFee(),
          contract._sellFundFee(),contract._sellLPFee(),contract.sell_burnFee(),
          contract.removeLiquidityFee(),contract.addLiquidityFee(),contract.enableAddLiquidity(),
          contract.lpBurnRate(),contract.lpBurnFrequency()
        ]);
        document.getElementById('taxRatesContainer').innerHTML = `
          <div class="param-group">
            <div class="param-title">买入手续费 (%)</div>
            <div class="row g-2">
              <div class="col-4"><label>基金</label><input type="number" id="buyFundFeeInput" class="form-control form-control-sm" value="${fromBP(bf)}" step="0.01"></div>
              <div class="col-4"><label>LP</label><input type="number" id="buyLPFeeInput" class="form-control form-control-sm" value="${fromBP(bl)}" step="0.01"></div>
              <div class="col-4"><label>燃烧</label><input type="number" id="buyBurnFeeInput" class="form-control form-control-sm" value="${fromBP(bb)}" step="0.01"></div>
            </div>
            <div class="param-example">例：基金2 LP1 燃烧1 = 总4%</div>
          </div>
          <div class="param-group">
            <div class="param-title">卖出手续费 (%)</div>
            <div class="row g-2">
              <div class="col-4"><label>基金</label><input type="number" id="sellFundFeeInput" class="form-control form-control-sm" value="${fromBP(sf)}" step="0.01"></div>
              <div class="col-4"><label>LP</label><input type="number" id="sellLPFeeInput" class="form-control form-control-sm" value="${fromBP(sl)}" step="0.01"></div>
              <div class="col-4"><label>燃烧</label><input type="number" id="sellBurnFeeInput" class="form-control form-control-sm" value="${fromBP(sb)}" step="0.01"></div>
            </div>
          </div>
          <div class="param-group">
            <div class="param-title">流动性税 (%)</div>
            <div class="row g-2">
              <div class="col-6"><label>移除</label><input type="number" id="removeLiqFeeInput" class="form-control form-control-sm" value="${fromBP(rl)}" step="0.01"></div>
              <div class="col-6"><label>添加</label><input type="number" id="addLiqFeeInput" class="form-control form-control-sm" value="${fromBP(al)}" step="0.01"></div>
            </div>
          </div>
          <div class="param-group">
            <div class="param-title">底池燃烧</div>
            <div class="row g-2">
              <div class="col-6"><label>燃烧率 (%)</label><input type="number" id="lpBurnRateInput" class="form-control form-control-sm" value="${fromBP(rate)}" step="0.01"></div>
              <div class="col-6"><label>频率(小时)</label><input type="number" id="lpBurnFreqInput" class="form-control form-control-sm" value="${freq/3600}"></div>
            </div>
          </div>
          <div>允许添加流动性：${ena?'✅':'❌'}</div>
        `;
        document.getElementById('updateTaxBtn').onclick = ()=>{
          const arr = ['buyFundFeeInput','buyLPFeeInput','buyBurnFeeInput','sellFundFeeInput','sellLPFeeInput','sellBurnFeeInput'].map(id=>parseFloat(document.getElementById(id).value));
          if(arr.some(isNaN)) return alert('数字无效');
          sendTx(contract.completeCustoms(arr.map(toBP)), '费率已更新');
        };
        document.getElementById('setAddLiqFeeBtn').onclick = ()=>{
          const v = parseFloat(document.getElementById('addLiqFeeInput').value);
          if(!isNaN(v)) sendTx(contract.setAddLiquidityFee(toBP(v)));
        };
        document.getElementById('setRemoveLiqFeeBtn').onclick = ()=>{
          const v = parseFloat(document.getElementById('removeLiqFeeInput').value);
          if(!isNaN(v)) sendTx(contract.setRemoveLiquidityFee(toBP(v)));
        };
        document.getElementById('setLpBurnRateBtn').onclick = ()=>{
          const v = parseFloat(document.getElementById('lpBurnRateInput').value);
          if(!isNaN(v)) sendTx(contract.setlpBurnRate(toBP(v)));
        };
        document.getElementById('setLpBurnFreqBtn').onclick = ()=>{
          const v = parseFloat(document.getElementById('lpBurnFreqInput').value);
          if(!isNaN(v)) sendTx(contract.setlpBurnFrequency(Math.floor(v)));
        };
        document.getElementById('toggleAddLiqBtn').onclick = async ()=>{
          const cur = await contract.enableAddLiquidity();
          sendTx(contract.setEnableAddLiquidity(!cur));
        };
        document.getElementById('disableChangeTaxBtn').onclick = ()=> sendTx(contract.disableChangeTax(), '费率已锁定');
      }

      async function loadInvite() {
        const [gen,f,s,t,l,minInv,minTrans] = await Promise.all([
          contract.generations(),contract.fristRate(),contract.secondRate(),contract.thirdRate(),
          contract.leftRate(),contract.minInvitorHoldAmount(),contract._minTransAmount()
        ]);
        document.getElementById('inviteParamsContainer').innerHTML = `
          <div class="param-group">
            <div class="param-title">代数与比例</div>
            <div class="row g-2">
              <div class="col-2"><label>代数</label><input type="number" id="generationsInput" class="form-control form-control-sm" value="${gen}"></div>
              <div class="col-2"><label>一代%</label><input type="number" id="fristRateInput" class="form-control form-control-sm" value="${f}"></div>
              <div class="col-2"><label>二代%</label><input type="number" id="secondRateInput" class="form-control form-control-sm" value="${s}"></div>
              <div class="col-2"><label>三代%</label><input type="number" id="thirdRateInput" class="form-control form-control-sm" value="${t}"></div>
              <div class="col-2"><label>其余%</label><input type="number" id="leftRateInput" class="form-control form-control-sm" value="${l}"></div>
            </div>
            <div class="param-desc">一代+二代+三代+其余×(代数-3)=100</div>
          </div>
          <div class="param-group">
            <div class="row g-2">
              <div class="col-6"><label>最小邀请持仓</label><input type="number" id="minInvitorHoldInput" class="form-control form-control-sm" value="${fromUnits(minInv)}"></div>
              <div class="col-6"><label>最小转账额</label><input type="number" id="minTransAmountInput" class="form-control form-control-sm" value="${fromUnits(minTrans)}"></div>
            </div>
          </div>
        `;
        document.getElementById('updateInviteRatesBtn').onclick = ()=>{
          const gen = parseInt(document.getElementById('generationsInput').value);
          const f = parseInt(document.getElementById('fristRateInput').value);
          const s = parseInt(document.getElementById('secondRateInput').value);
          const t = parseInt(document.getElementById('thirdRateInput').value);
          const l = parseInt(document.getElementById('leftRateInput').value);
          if(isNaN(gen+f+s+t+l)) return alert('数字无效');
          sendTx(contract.changeInviteRate([gen,f,s,t,l]));
        };
        document.getElementById('setMinInvitorHoldBtn2').onclick = ()=>{
          const v = document.getElementById('minInvitorHoldInput').value;
          if(v&&!isNaN(v)) sendTx(contract.setMinInvitorHoldAmount(toUnits(v)));
        };
        document.getElementById('setMinTransBtn2').onclick = ()=>{
          const v = document.getElementById('minTransAmountInput').value;
          if(v&&!isNaN(v)) sendTx(contract.setMinTransAmount(toUnits(v)));
        };
        document.getElementById('queryInviteBtn').onclick = async ()=>{
          const addr = document.getElementById('inviteQueryAddress').value;
          if(!ethers.utils.isAddress(addr)) return alert('无效地址');
          const inviter = await contract._inviter(addr);
          const len = await contract.getBinderLength(addr);
          document.getElementById('inviteQueryResult').innerHTML = `邀请人：${inviter} | 邀请人数：${len}`;
        };
        document.getElementById('queryBindersBtn').onclick = async ()=>{
          const owner = document.getElementById('binderOwnerInput').value;
          if(!ethers.utils.isAddress(owner)) return;
          const len = await contract.getBinderLength(owner);
          let list = '';
          for(let i=0;i<len;i++) list += `<div>${await contract._binders(owner,i)}</div>`;
          document.getElementById('bindersList').innerHTML = list || '无';
        };
      }

      async function loadMining() {
        const [cond,minLP,minInv,idx,block,debt,time,len] = await Promise.all([
          contract.LPRewardCondition(),contract.minLPHoldAmount(),contract.minInvitorHoldAmount(),
          contract._currentMineLPIndex(),contract._progressMineLPBlock(),contract._progressMineLPBlockDebt(),
          contract._mineLPRewardTimeDebt(),contract.getLPProviderLength()
        ]);
        document.getElementById('miningParamsContainer').innerHTML = `
          <div class="param-group">
            <div class="row g-2">
              <div class="col-4"><label>奖励条件</label><input type="number" id="lpRewardConditionInput" class="form-control form-control-sm" value="${fromUnits(cond)}"></div>
              <div class="col-4"><label>最小LP持仓</label><input type="number" id="minLPHoldInput" class="form-control form-control-sm" value="${fromUnits(minLP)}"></div>
              <div class="col-4"><label>最小邀请持仓</label><input type="number" id="minInvitorHoldInput2" class="form-control form-control-sm" value="${fromUnits(minInv)}"></div>
            </div>
            <div class="param-desc">冷却：${(time/3600).toFixed(1)}小时</div>
          </div>
          <div>当前索引：${idx} | 进度块：${block}</div>
          <div class="mt-2"><label>排除LP地址</label><input type="text" id="excludeLpAddress" class="form-control form-control-sm"></div>
        `;
        document.getElementById('setLpRewardConditionBtn').onclick = ()=>{
          const v = document.getElementById('lpRewardConditionInput').value;
          if(v&&!isNaN(v)) sendTx(contract.setLPRewardCondition(toUnits(v)));
        };
        document.getElementById('setMinLPHoldBtn').onclick = ()=>{
          const v = document.getElementById('minLPHoldInput').value;
          if(v&&!isNaN(v)) sendTx(contract.setMinLPHoldAmount(toUnits(v)));
        };
        document.getElementById('setMinInvitorHoldBtn').onclick = ()=>{
          const v = document.getElementById('minInvitorHoldInput2').value;
          if(v&&!isNaN(v)) sendTx(contract.setMinInvitorHoldAmount(toUnits(v)));
        };
        document.getElementById('setExcludeLpBtn').onclick = async ()=>{
          const addr = document.getElementById('excludeLpAddress').value;
          if(!addr||!ethers.utils.isAddress(addr)) return;
          const cur = await contract.excludeLpProvider(addr);
          sendTx(contract.setExcludeLPProvider(addr,!cur));
        };
        let html = `<small>共${len}个</small><div class="row">`;
        for(let i=0;i<Math.min(len,20);i++){
          const a = await contract.lpProviders(i);
          const ex = await contract.excludeLpProvider(a);
          html += `<div class="col-6"><small>${a.slice(0,8)}... ${ex?'❌':''}</small></div>`;
        }
        html += '</div>';
        document.getElementById('lpProvidersContainer').innerHTML = html;
      }

      async function loadSwitches() {
        const sw = {
          antiSYNC: await contract.antiSYNC(),
          enableOffTrade: await contract.enableOffTrade(),
          enableKillBlock: await contract.enableKillBlock(),
          enableRewardList: await contract.enableRewardList(),
          enableChangeTax: await contract.enableChangeTax(),
          airdropEnable: await contract.airdropEnable(),
          enablePause: await contract.enablePause(),
          pause: await contract.pause(),
          enableMint: await contract.enableMint(),
          enableWalletLimit: await contract.enableWalletLimit(),
          presaleEnabled: await contract.presaleEnabled()
        };
        let html = '';
        for(let [k,v] of Object.entries(sw)) html += `<div class="info-row"><span class="info-label">${k}</span><span class="info-value">${v?'✅':'❌'}</span></div>`;
        document.getElementById('switchesContainer').innerHTML = html;
        const [mw,an,kb] = await Promise.all([contract.maxWalletAmount(),contract.airdropNumbs(),contract.kb()]);
        document.getElementById('limitsContainer').innerHTML = `
          <div class="row g-2">
            <div class="col-4"><label>最大持仓</label><input type="number" id="maxWalletInput" class="form-control form-control-sm" value="${fromUnits(mw)}"></div>
            <div class="col-4"><label>空投数</label><input class="form-control form-control-sm" value="${an}" disabled></div>
            <div class="col-4"><label>KB</label><input type="number" id="kbInput" class="form-control form-control-sm" value="${kb}"></div>
          </div>
        `;
        document.getElementById('setMaxWalletBtn').onclick = ()=>{
          const v = document.getElementById('maxWalletInput').value;
          if(v) sendTx(contract.setMaxWalletAmount(toUnits(v)));
        };
        document.getElementById('setKbBtn').onclick = ()=>{
          const v = document.getElementById('kbInput').value;
          if(v) sendTx(contract.setkb(v));
        };
        // 开关事件
        document.getElementById('toggleAntiSyncBtn').onclick = ()=> toggle('antiSYNC','setAntiSYNCEnable');
        document.getElementById('toggleAirdropBtn').onclick = ()=> toggle('airdropEnable','setAirDropEnable');
        document.getElementById('togglePauseBtn').onclick = ()=> toggle('pause','setPause');
        document.getElementById('toggleEnablePauseBtn').onclick = ()=> toggle('enablePause','setEnablePause');
        document.getElementById('toggleEnableMintBtn').onclick = ()=> toggle('enableMint','setEnableMint');
        document.getElementById('toggleWalletLimitBtn').onclick = ()=> toggle('enableWalletLimit','setEnableWalletLimit');
        document.getElementById('disableMintBtn').onclick = ()=> sendTx(contract.disableMint());
        document.getElementById('disableWalletLimitBtn').onclick = ()=> sendTx(contract.disableWalletLimit());
      }

      async function toggle(getter, setter) {
        const cur = await contract[getter]();
        sendTx(contract[setter](!cur));
      }

      async function loadPresale() {
        const [ena,price,ap,lim,mt] = await Promise.all([
          contract.presaleEnabled(),contract.price(),contract.amountPerUnits(),contract.mintLimit(),contract.minted()
        ]);
        document.getElementById('presaleContainer').innerHTML = `
          <div class="row g-2">
            <div class="col-3"><label>单价(ETH)</label><input type="number" id="priceInput" class="form-control form-control-sm" value="${ethers.utils.formatEther(price)}" step="0.0001"></div>
            <div class="col-3"><label>每单位代币</label><input type="number" id="amountPerInput" class="form-control form-control-sm" value="${fromUnits(ap)}"></div>
            <div class="col-3"><label>上限</label><input type="number" id="mintLimitInput" class="form-control form-control-sm" value="${lim}"></div>
            <div class="col-3"><label>已售</label><input class="form-control form-control-sm" value="${mt}" disabled></div>
          </div>
          <div>预售：${ena?'✅开启':'❌关闭'}</div>
        `;
        document.getElementById('togglePresaleBtn').onclick = async ()=>{
          const cur = await contract.presaleEnabled();
          sendTx(contract.setPresaleEnabled(!cur));
        };
        document.getElementById('setPriceBtn').onclick = ()=>{
          const v = document.getElementById('priceInput').value;
          if(v) sendTx(contract.setPrice(ethers.utils.parseEther(v)));
        };
        document.getElementById('setAmountPerUnitsBtn').onclick = ()=>{
          const v = document.getElementById('amountPerInput').value;
          if(v) sendTx(contract.setAmountPerUnits(toUnits(v)));
        };
        document.getElementById('setMintLimitBtn').onclick = ()=>{
          const v = document.getElementById('mintLimitInput').value;
          if(v) sendTx(contract.setMintLimit(v));
        };
      }

      // 白名单/黑名单
      document.getElementById('addFeeWhiteBtn').onclick = ()=>{
        const addr = document.getElementById('whitelistAddressInput').value;
        if(ethers.utils.isAddress(addr)) sendTx(contract.setFeeWhiteList([addr],true));
      };
      document.getElementById('removeFeeWhiteBtn').onclick = ()=>{
        const addr = document.getElementById('whitelistAddressInput').value;
        if(ethers.utils.isAddress(addr)) sendTx(contract.setFeeWhiteList([addr],false));
      };
      document.getElementById('batchRewardListBtn').onclick = ()=>{
        const addrs = document.getElementById('batchAddressInput').value.split(',').map(s=>s.trim()).filter(ethers.utils.isAddress);
        if(addrs.length) sendTx(contract.multi_bclist(addrs,true));
      };
      document.getElementById('addSwapPairBtn').onclick = ()=>{
        const addr = document.getElementById('swapPairInput').value;
        if(ethers.utils.isAddress(addr)) sendTx(contract.setSwapPairList(addr,true));
      };
      document.getElementById('removeSwapPairBtn').onclick = ()=>{
        const addr = document.getElementById('swapPairInput').value;
        if(ethers.utils.isAddress(addr)) sendTx(contract.setSwapPairList(addr,false));
      };

      // 查询
      document.getElementById('queryAllBtn').onclick = async ()=>{
        const addr = document.getElementById('queryAddressInput').value;
        if(!ethers.utils.isAddress(addr)) return;
        const [bal,inv,len,fw,rw,isR,idx,ex,last] = await Promise.all([
          contract.balanceOf(addr),contract._inviter(addr),contract.getBinderLength(addr),
          contract._feeWhiteList(addr),contract._rewardList(addr),contract.isReward(addr),
          contract.lpProviderIndex(addr),contract.excludeLpProvider(addr),contract._lastMineLPRewardTimes(addr)
        ]);
        document.getElementById('queryAllResult').innerHTML = `
          <div>余额：${fromUnits(bal)} | 邀请人：${inv}</div>
          <div>绑定者：${len} | 白名单：${fw?'是':'否'} | 黑名单：${rw?'是':'否'}</div>
          <div>LP索引：${idx} ${ex?'(排除)':''} | isReward：${isR}</div>
          <div>最后挖矿：${last>0?new Date(last*1000).toLocaleString():'从未'}</div>
        `;
      };

      // 工具箱
      document.getElementById('setFundAddressBtn').onclick = ()=>{
        const addr = document.getElementById('newFundAddress').value;
        if(ethers.utils.isAddress(addr)) sendTx(contract.setFundAddress(addr));
      };
      document.getElementById('claimBalanceBtn').onclick = ()=> sendTx(contract.claimBalance());
      document.getElementById('claimTokenBtn').onclick = ()=>{
        const token = document.getElementById('claimTokenAddress').value;
        const amount = document.getElementById('claimTokenAmount').value;
        const to = document.getElementById('claimTokenTo').value || currentAccount;
        if(token&&amount) sendTx(contract.claimToken(token,toUnits(amount),to));
      };
      document.getElementById('claimContractTokenBtn').onclick = ()=>{
        const dis = document.getElementById('claimContractDistributor').value;
        const token = document.getElementById('claimContractTokenAddr').value;
        const amount = document.getElementById('claimContractAmount').value;
        if(dis&&token&&amount) sendTx(contract.claimContractToken(dis,token,toUnits(amount)));
      };
      document.getElementById('mintTokenBtn').onclick = ()=>{
        const addr = document.getElementById('mintTo').value;
        const amount = document.getElementById('mintAmount').value;
        if(addr&&amount) sendTx(contract.mintToken(addr,toUnits(amount)));
      };
      document.getElementById('renounceOwnershipBtn').onclick = ()=>{
        if(confirm('放弃所有权不可逆，确定吗？')) sendTx(contract.renounceOwnership());
      };
      document.getElementById('transferOwnershipBtn').onclick = ()=>{
        const addr = document.getElementById('transferOwnershipInput').value;
        if(ethers.utils.isAddress(addr)) sendTx(contract.transferOwnership(addr));
      };

      document.getElementById('launchBtn').onclick = ()=> sendTx(contract.launch());

      async function sendTx(promise, msg='成功') {
        try {
          const tx = await promise;
          log(`交易：${tx.hash}`, 'info');
          await tx.wait();
          log(msg, 'success');
          await refreshAll();
        } catch(e) { log('失败：'+ (e.reason||e.message), 'error'); }
      }

      if(window.ethereum && window.ethereum.selectedAddress) {
        document.getElementById('connectWalletBtn').click();
      }
    })();
  </script>
</body>
</html>
